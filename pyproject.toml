[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "panel-driver"
version = "0.1.0"
description = "Drive a HOTSPOTEK USB HID bar display directly from Python"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cameron Horton" }]
dependencies = [
    "hid>=1.0",
    "Pillow>=10",
]

[project.optional-dependencies]
app = ["psutil", "defusedxml"]
dev = ["pytest", "ruff", "psutil", "defusedxml"]

[project.scripts]
smart-panel = "smart_panel.cli.main:main"

[tool.setuptools.packages.find]
include = ["panel_driver*", "smart_panel*"]

[tool.setuptools.package-data]
smart_panel = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires the physical HOTSPOTEK panel attached (skipped by default)",
]
addopts = "-m 'not hardware'"
